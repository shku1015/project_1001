# 개발용 PostgreSQL (ADR-0019). 앱은 IDE 또는 ./mvnw로 실행한다.
# 사용: cp .env.example .env → DB_PASSWORD 채우기 → docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: admin-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-admin}
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-admin} -d ${DB_NAME:-admin}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
