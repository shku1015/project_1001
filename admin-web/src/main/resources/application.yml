# 비밀값은 환경 변수로만 넣는다 (공개 저장소). 로컬은 루트의 .env를 읽는다.
spring:
  application:
    name: admin
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:admin}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
    placeholders:
      # 테스트 데이터(local 프로필)의 테스트 관리자 비밀번호. 운영에서는 쓰지 않는다.
      testAdminPassword: ${TEST_ADMIN_PASSWORD:}
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  jackson:
    time-zone: Asia/Seoul
  session:
    # ③ JSP SSR 세션: DB 저장, 30분 동안 요청이 없으면 만료 (NF 1.4). 테이블은 Flyway V4가 만든다.
    timeout: 30m
    jdbc:
      initialize-schema: never
  cache:
    type: caffeine
    cache-names: adminAuthInfo
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      cookie:
        # ③ 세션 쿠키 (NF-WS-03). Secure는 운영(HTTPS)에서 켠다
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:true}
  error:
    include-stacktrace: never

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  file:
    base-path: ${FILE_BASE_PATH:./data/files}
  # ① React 빌드 결과(admin-react/dist) 위치. 서버가 /react/** 로 제공한다
  react:
    location: ${REACT_DIST:file:../admin-react/dist/}
  ui:
    tabler-version: 1.6.1
  auth:
    # 비밀값은 환경 변수로만 넣는다 (공개 저장소)
    jwt-secret: ${JWT_SECRET:}
    initial-admin-password: ${INITIAL_ADMIN_PASSWORD:}
    access-token-ttl: 30m
    refresh-token-ttl: 8h
    # 운영(HTTPS)은 true. 로컬 HTTP는 .env의 COOKIE_SECURE=false
    cookie-secure: ${COOKIE_SECURE:true}
    allowed-origins: ${ALLOWED_ORIGINS:}
