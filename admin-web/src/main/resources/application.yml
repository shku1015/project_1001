# 비밀값은 환경 변수로만 넣는다 (공개 저장소). 로컬은 루트의 .env를 읽는다.
spring:
  application:
    name: admin
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:admin}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    include-stacktrace: never

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  file:
    base-path: ${FILE_BASE_PATH:./data/files}
