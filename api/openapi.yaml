openapi: 3.0.3
info:
  title: 관리자 서비스 API
  version: 0.1.0
  description: |
    ① React와 ② JSP + API가 호출하는 REST API의 정본 (ADR-0020, 명세 우선).
    규약·업무 설명은 docs/06-api-spec.md, 모듈별 설명은 docs/06-api/*.md.
    API를 바꿀 때는 이 파일을 먼저 고친다. 서버는 계약 테스트로, React는 생성 타입으로 맞춘다.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: auth
    description: 로그인·토큰·내 정보 (docs/06-api/00-auth.md)
  - name: common
    description: 여러 화면에서 쓰는 조회 API (docs/06-api-spec.md 9절)
  - name: code
    description: 코드관리 (docs/06-api/04-code.md)
  - name: menu
    description: 메뉴관리 (docs/06-api/03-menu.md)
  - name: role
    description: 역할관리 (docs/06-api/08-role.md)
  - name: permission
    description: 권한관리 (docs/06-api/07-permission.md)
  - name: admin
    description: 관리자관리 (docs/06-api/06-admin.md)

paths:
  /auth/token:
    post:
      tags: [auth]
      operationId: login
      summary: 로그인. Access Token 응답 + Refresh Token 쿠키
      description: |
        성공하면 Set-Cookie로 refreshToken(HttpOnly, SameSite=Strict, Path=/api/v1/auth/token)을 내려준다.
        같은 아이디의 기존 로그인(세션·토큰)은 모두 끊는다 (NF-LG-02).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 아이디 또는 비밀번호 오류 (LOGIN_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 잠금·사용중지 계정 (ACCOUNT_LOCKED, ACCOUNT_DISABLED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [auth]
      operationId: logout
      summary: 로그아웃. Refresh Token 폐기, 쿠키 삭제
      responses:
        '200':
          description: 로그아웃 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/token/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: 토큰 재발급 (Refresh Token 쿠키 사용, 한 번 쓰면 교체)
      security: []
      responses:
        '200':
          description: 새 Access Token + 새 Refresh Token 쿠키
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: 만료·폐기·재사용된 Refresh Token (REFRESH_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 내 정보 + 메뉴 트리 + 권한 목록 (메뉴 노출·버튼 활성화용)
      responses:
        '200':
          description: 내 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /me:
    put:
      tags: [auth]
      operationId: updateMyInfo
      summary: 내 정보 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyInfoRequest'
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/password:
    put:
      tags: [auth]
      operationId: changeMyPassword
      summary: 비밀번호 변경
      description: |
        성공하면 이 관리자의 다른 로그인(세션·Refresh Token)을 모두 끊고,
        현재 로그인을 이어가도록 새 Access Token과 새 Refresh Token 쿠키를 준다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 변경 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /common/codes/{groupCd}:
    get:
      tags: [common]
      operationId: getCodes
      summary: 그룹코드의 상세코드 목록 (코드 콤보용)
      parameters:
        - name: groupCd
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z0-9_]+$'
          example: USER_STATUS
        - name: includeUnused
          in: query
          description: Y면 사용 안 함 코드도 포함 (이미 저장된 값 표시용)
          schema:
            $ref: '#/components/schemas/YnFlag'
      responses:
        '200':
          description: 정렬 순서대로
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /common/codes:
    get:
      tags: [common]
      operationId: getCodesByGroups
      summary: 여러 그룹코드의 상세코드를 한 번에
      parameters:
        - name: groups
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items:
              type: string
              pattern: '^[A-Z0-9_]+$'
          example: [USER_STATUS, USER_TYPE]
      responses:
        '200':
          description: 그룹코드별 상세코드 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeMapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /code-groups:
    get:
      tags: [code]
      operationId: listCodeGroups
      summary: 그룹코드 목록 (SCR-COD-01 왼쪽, 페이징 없음)
      parameters:
        - name: keyword
          in: query
          description: 그룹코드 또는 그룹코드명 부분 일치
          schema:
            type: string
        - name: useYn
          in: query
          schema:
            $ref: '#/components/schemas/YnFlag'
      responses:
        '200':
          description: 그룹코드 오름차순
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeGroupListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [code]
      operationId: createCodeGroup
      summary: 그룹코드 등록 (COD-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeGroupRequest'
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /code-groups/{groupCd}:
    parameters:
      - $ref: '#/components/parameters/GroupCd'
    get:
      tags: [code]
      operationId: getCodeGroup
      summary: 그룹코드 상세 (수정 팝업)
      responses:
        '200':
          description: 그룹코드 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeGroupResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [code]
      operationId: updateCodeGroup
      summary: 그룹코드 수정 (COD-03). groupCd는 무시, 시스템 코드는 useYn 무시
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeGroupUpdateRequest'
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [code]
      operationId: deleteCodeGroup
      summary: 그룹코드 삭제 (COD-04). 시스템 코드·상세코드 있으면 불가
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /code-groups/{groupCd}/codes:
    parameters:
      - $ref: '#/components/parameters/GroupCd'
    get:
      tags: [code]
      operationId: listCodes
      summary: 상세코드 목록 (COD-05, 정렬 순서 오름차순)
      responses:
        '200':
          description: 상세코드 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeDetailListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [code]
      operationId: createCode
      summary: 상세코드 등록 (COD-06)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeDetailRequest'
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /code-groups/{groupCd}/codes/{code}:
    parameters:
      - $ref: '#/components/parameters/GroupCd'
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Z0-9_]+$'
    put:
      tags: [code]
      operationId: updateCode
      summary: 상세코드 수정 (COD-07). code는 무시
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeDetailUpdateRequest'
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [code]
      operationId: deleteCode
      summary: 상세코드 삭제 (COD-08). 시스템 코드 그룹이면 불가. 실제 삭제
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /menus/tree:
    get:
      tags: [menu]
      operationId: getMenuTree
      summary: 전체 메뉴 트리 (MNU-01). 사용 안 함 메뉴도 포함
      responses:
        '200':
          description: depth, sortOrd 순서의 트리
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuTreeResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /menus/check-menu-cd:
    get:
      tags: [menu]
      operationId: checkMenuCd
      summary: 메뉴 코드 중복 확인
      parameters:
        - name: menuCd
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Z0-9_]+$'
            maxLength: 50
      responses:
        '200':
          description: 사용할 수 있으면 available=true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /menus:
    post:
      tags: [menu]
      operationId: createMenu
      summary: 메뉴 등록 (MNU-03). 같은 상위 메뉴의 맨 뒤 순서가 되고, 화면 메뉴는 사용 액션만큼 권한이 생긴다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCreateRequest'
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCreatedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /menus/order:
    put:
      tags: [menu]
      operationId: saveMenuOrder
      summary: 순서 저장 (MNU-06). 상위 메뉴별 하위 메뉴 목록을 빠짐없이 보낸다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuOrderRequest'
      responses:
        '200':
          description: 저장 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /menus/{menuId}:
    parameters:
      - $ref: '#/components/parameters/MenuId'
    get:
      tags: [menu]
      operationId: getMenu
      summary: 메뉴 상세 (MNU-02)
      responses:
        '200':
          description: 메뉴 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuDetailResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [menu]
      operationId: updateMenu
      summary: 메뉴 수정 (MNU-04). 액션을 빼면 회수되는 역할을 돌려준다
      description: |
        dryRun=Y면 저장하지 않고 회수될 역할만 돌려준다 (프론트는 이 결과로 확인창을 띄운다).
        시스템 메뉴·게시판 자동 메뉴는 메뉴명·아이콘만 바꿀 수 있다.
      parameters:
        - name: dryRun
          in: query
          schema:
            $ref: '#/components/schemas/YnFlag'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuUpdateRequest'
      responses:
        '200':
          description: 회수된(dryRun이면 회수될) 역할
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuUpdateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [menu]
      operationId: deleteMenu
      summary: 메뉴 삭제 (MNU-07). 권한과 역할 매핑도 함께 지운다
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /menus/{menuId}/parent:
    parameters:
      - $ref: '#/components/parameters/MenuId'
    patch:
      tags: [menu]
      operationId: moveMenu
      summary: 상위 메뉴 변경 (MNU-05). 새 상위 메뉴의 맨 뒤 순서가 된다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuMoveRequest'
      responses:
        '200':
          description: 이동 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /roles:
    get:
      tags: [role]
      operationId: listRoles
      summary: 역할 목록 (ROL-01). 페이징 없음, 등록순
      parameters:
        - name: keyword
          in: query
          description: 역할 코드·역할명
          schema: { type: string, maxLength: 100 }
        - name: useYn
          in: query
          schema:
            $ref: '#/components/schemas/YnFlag'
      responses:
        '200':
          description: 역할 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
